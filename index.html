<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coin" />
    <title>Coin</title>
    <script>
      (function () {
        var mode = localStorage.getItem('coin_theme_mode')
        var accent = localStorage.getItem('coin_theme_accent')
        if (mode && mode !== 'system') document.documentElement.setAttribute('data-theme', mode)
        if (accent && accent !== 'blue') document.documentElement.setAttribute('data-accent', accent)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
